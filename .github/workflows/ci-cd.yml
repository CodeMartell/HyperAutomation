name: CI/CD Pipeline - HyperAutomation GHCR

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  # =========================================================================
  # ETAPA 1: CI (Continuous Integration) — Testes e Validação de Sintaxe
  # =========================================================================
  test:
    name: "CI — Testes Automatizados & Sintaxe"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar ambiente Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Validar Sintaxe (compileall)
        run: |
          python -m compileall .

      - name: Executar Testes Automatizados (pytest & coverage)
        run: |
          python -m pytest -v --cov=. --cov-report=term-missing

  # =========================================================================
  # ETAPA 2: CD (Continuous Delivery/Deployment) — Docker Build & GHCR Push
  # =========================================================================
  build-and-push:
    name: "CD — Docker Build & Publicação no GHCR"
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Converter nome do repositório para minúsculas
        id: string
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Docker Build & Push para GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=inline
